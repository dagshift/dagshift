# Documentation site: builds docs/ with Zensical and publishes it to GitHub Pages.
#
# Pull requests only build (so a broken page fails the check); pushes to main also deploy.
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
# The site is served at https://dagshift.github.io/dagshift/.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "editors/vscode/media/**"
      - "tools/docs_assets.py"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "editors/vscode/media/**"
      - "tools/docs_assets.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "zensical<0.1"
      - name: copy the icon and screenshots from the extension
        run: python tools/docs_assets.py
      - run: zensical build --clean
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
